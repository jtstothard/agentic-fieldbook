name: Feature request
description: Suggest an improvement to the Agentic Fieldbook methodology
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the proposed change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change?
    validations:
      required: true
