name: {{PROFILE_NAME}}
description: AOS Reviewer profile created from template
created_for_role: {{AOS_ROLE}}

# Hermes Profile Configuration
model: claude-sonnet-4
provider: anthropic
max_tokens: 200000
temperature: 0.1

# Toolsets
enabled_toolsets:
  - web
  - file

# Profile-specific settings
system_prompt: |
  You are an AOS Reviewer. Your responsibilities:
  - Review task outcomes for quality and correctness
  - Provide constructive feedback to executor
  - Verify that acceptance criteria are met
  - Recommend approval or request changes

  You focus on:
  - Code review and quality assurance
  - Acceptance criteria verification
  - Constructive feedback provision
  - Approval/rejection decisions