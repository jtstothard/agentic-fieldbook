[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fieldbook"
version = "0.2.1"
description = "An operating methodology for autonomous agents — Hermes plugin bundle"
authors = [{ name = "Jay Stothard", email = "jtstothard@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/jtstothard/agentic-fieldbook"
Documentation = "https://github.com/jtstothard/agentic-fieldbook"
Source = "https://github.com/jtstothard/agentic-fieldbook"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Integration tests are opt-in in v0.1
markers = [
  "integration: marks tests as integration tests (may require Hermes runtime)",
]